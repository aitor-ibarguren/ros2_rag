name: flake8 Lint

on:
  push:
  pull_request:

jobs:
  flake8-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo & submodules
      - name: Check out source repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Flake8 lint
      - name: flake8 Lint
        uses: py-actions/flake8@v2