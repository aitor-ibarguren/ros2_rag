ros2_rag:
  ros__parameters:
    generator_family: 'qwen'
    generator_version: 'tiny'
    generator_loading: 'pretrained'
    knowledge_base_path: '/home/ubuntu/knowledge_base'
    retriever:
      top_k: 5
      alpha: 0.6
    generator:
      max_new_tokens: 50
      temperature: 0.5
      top_p: 0.9