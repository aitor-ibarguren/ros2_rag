ros2_rag:
  ros__parameters:
    generator_family: 'qwen'
    generator_version: 'xtiny'
    generator_loading: 'pretrained'
    knowledge_base_path: '/tmp/knowledge_base'
    retriever:
      top_k: 5
      alpha: 0.6
    generator:
      max_new_tokens: 50
      temperature: 0.5
      top_p: 0.9
    history_active: true
    history:
      recent_interaction_number: 1
      evicted_interaction_number: 1
    format:
      remove_bullets: true